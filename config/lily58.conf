# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Increase keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable display support
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Enable split keyboard
CONFIG_ZMK_SPLIT=y

# Make sure BLE split support is enabled
CONFIG_ZMK_SPLIT_BLE=y

# Improve connection parameters
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
