name: Build Firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: lily58_left nice_view_adapter nice_view
            artifact-name: lily58_left
          - board: nice_nano_v2
            shield: lily58_right nice_view_adapter nice_view
            artifact-name: lily58_right
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Cache west modules
        uses: actions/cache@v3
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-modules-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-modules-
      
      - name: Initialize west workspace
        run: |
          west init -l config
          west update
          west zephyr-export
      
      - name: Build firmware (${{ matrix.board }} / ${{ matrix.shield }})
        run: |
          west build -s zmk/app -b ${{ matrix.board }} -- -DSHIELD="${{ matrix.shield }}" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 "artifacts/${MATRIX_ARTIFACT_NAME}.uf2"
          elif [ -f build/zephyr/zmk.hex ]; then
            cp build/zephyr/zmk.hex "artifacts/${MATRIX_ARTIFACT_NAME}.hex"
          fi
        env:
          MATRIX_ARTIFACT_NAME: ${{ matrix.artifact-name }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts
